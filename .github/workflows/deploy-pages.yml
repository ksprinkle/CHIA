name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]

# GitHub Pages deployment (OIDC) requires these scopes.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize Pages deployments: never run two at once, and let an in-progress
# production deployment finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://chia-county-explorer-api.onrender.com/api/v1
        run: npm run build

      # The map layers load committed TopoJSON from frontend/public/geo/, which
      # Vite copies verbatim into dist/geo/. If that copy is ever incomplete the
      # deployed maps break silently, so fail the deployment here instead.
      - name: Verify geography assets are present in the build
        working-directory: frontend
        run: |
          set -euo pipefail

          fail() { echo "::error::$1"; exit 1; }

          # 1. National state boundaries.
          [ -f dist/geo/us-states.topojson ] \
            || fail "dist/geo/us-states.topojson is missing from the build output"

          # 2. Every committed county TopoJSON must have a dist/ counterpart.
          missing=0
          for src in public/geo/counties/*.topojson; do
            name="$(basename "$src")"
            if [ ! -f "dist/geo/counties/$name" ]; then
              echo "::error::dist/geo/counties/$name is missing from the build output"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

          # 3. Exact file-count contract (catches silent drops and stray extras).
          expected_counties=51
          source_counties="$(find public/geo/counties -maxdepth 1 -name '*.topojson' | wc -l)"
          built_counties="$(find dist/geo/counties -maxdepth 1 -name '*.topojson' | wc -l)"
          built_total="$(find dist/geo -name '*.topojson' | wc -l)"
          [ "$source_counties" -eq "$expected_counties" ] \
            || fail "public/geo/counties has $source_counties .topojson files, expected $expected_counties (update this check if the county set intentionally changed)"
          [ "$built_counties" -eq "$expected_counties" ] \
            || fail "dist/geo/counties has $built_counties .topojson files, expected $expected_counties"
          [ "$built_total" -eq 52 ] \
            || fail "dist/geo has $built_total .topojson files, expected 52 (1 national + 51 counties)"

          echo "Geography assets OK: dist/geo/us-states.topojson + $built_counties county TopoJSON files."

      - name: Add SPA fallback (404.html mirrors index.html)
        working-directory: frontend
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
